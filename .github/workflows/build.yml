name: Build TV APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Scaffold project structure
        run: |
          mkdir -p app/src/main/java/com/drawabattle/tv
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/drawable

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt     app/src/main/java/com/drawabattle/tv/MainActivity.kt
          cp app-build.gradle.kts app/build.gradle.kts

          cp ic_launcher_mdpi.png    app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher_hdpi.png    app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ic_launcher_xhdpi.png   app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ic_launcher_xxhdpi.png  app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ic_launcher_xxxhdpi.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp tv_banner.png           app/src/main/res/drawable/tv_banner.png

      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DrawaBattle-TV
          path: app/build/outputs/apk/debug/app-debug.apk
